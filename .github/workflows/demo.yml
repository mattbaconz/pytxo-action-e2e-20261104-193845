name: Demo
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  demo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: npx pytxo demo
        shell: bash
        run: |
          start=$(date +%s)
          npx -y "pytxo@$PYTXO_VERSION" demo 2>&1 | tee demo.txt
          echo "took $(( $(date +%s) - start )) s"
          grep -q BLOCKED demo.txt
        env:
          PYTXO_VERSION: "2.0.0"
